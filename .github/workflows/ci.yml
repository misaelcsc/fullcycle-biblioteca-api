name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for services to be ready
        run: |
          echo "Esperando serviços ficarem prontos..."
          for i in {1..30}; do
            if docker compose exec -T api python -c "from src.database import engine; engine.connect()" 2>/dev/null; then
              echo "API pronta!"
              break
            fi
            echo "Tentativa $i..."
            sleep 5
          done
          docker compose ps

      - name: Run tests
        run: docker compose exec -T api pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Show logs on failure
        if: failure()
        run: docker compose logs